name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_pages.py'
      - 'scripts/deck.py'
      - 'scripts/build_kit.py'
      - 'requirements-pages.txt'
      - 'docs/fde-prezi-ko.md'
      - 'assets/diagrams/**'
      - 'deliverables/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pages.txt
      - run: python scripts/build_pages.py
      - run: python scripts/build_kit.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: build/pages

  deploy:
    # Enable after Pages is available for the repository and its source is Actions.
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
